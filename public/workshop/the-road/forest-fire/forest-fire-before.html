<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Forest Fire, before the fix · The Road</title>
<!--
  An exhibit, kept on purpose. before-sim.js is the Forest Fire simulation exactly as it
  was at 4c757675 (git show 4c757675:public/atlas/entries/forest-fire/sim.js, same blob
  f118cc25). It still carries the resize bug: when its frame gets narrower it throws
  "RangeError: offset is out of bounds" and stops. Don't fix this copy; the fixed one is
  forest-fire-after.html. Shown inside /workshop/the-road/.
-->
<link rel="stylesheet" href="/atlas/styles/main.css">
<link rel="stylesheet" href="./exhibit.css">
</head>
<body class="road-exhibit">
<header class="entry-head sr-only"><h1>Forest Fire, before the fix</h1></header>
<figure class="stage" id="stage"></figure>
<script src="/atlas/lib/atlas.js"></script>
<script src="./before-sim.js"></script>
<script>
  // The atlas labels its canvas "use the controls below", but this frame hides them.
  // Relabel here, after the sim has started; the sim and atlas.js stay as they were.
  (function () {
    var c = document.querySelector('#stage canvas');
    if (c) c.setAttribute('aria-label', 'Forest Fire simulation, before the fix. Click or drag on the grid to start a fire.');
    // The line under the canvas keeps only the atlas's own clock and frame rate: the
    // sim's counts run far wider than this small frame and were cut off.
    var s = window.Atlas && Atlas.instances[0];
    if (s) s.readout(function () { return ''; });
  })();
</script>
</body>
</html>
