name: Deploy to EC2

# Every push to main builds the site and rsyncs it to the EC2 webroot.
# Hosting moved off Netlify 2026-07-02 (incremental pushes are free here).
#
# ATELIER ONLY since 2026-07-27 — the town half (postmark.town, build:town →
# dist-town/ → /var/www/postmark-town-site/) moved to keeminlee/postmark-site
# in the extraction (gold plan postmark-site-extraction, P3 flip). That repo is
# the webroot's ONE writer now; re-adding a town step here would make two.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Refresh Postmark data from office API
        env:
          POSTMARK_API: https://postmark.town/api
        run: node tools/fetch-town.mjs
      - run: npm run build            # atelier  -> dist/

      - name: Rsync the atelier to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "$USER@$HOST:/var/www/starforge-atelier/"
          echo "atelier: deployed $(du -sh dist | cut -f1) to $HOST"
